[project]
name = "llm-eval-lab"
version = "0.1.0"
description = "A lab for llm evaluation."
readme = "README.md"
authors = [
    { name = "Joan Wang", email = "joanwangbupt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.98.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
llm-eval-lab = "llm_eval_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
